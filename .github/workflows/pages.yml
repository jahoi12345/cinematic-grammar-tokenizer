# Publishes the GitHub Pages site: the project report at the root (site/index.html and the PDF) and the static demo under app/
# (app/static/ plus the keyframes it names, copied from demo_data/). The demo's data files are committed (written by
# scripts/build_static_app.py), so this job only copies files: no package is installed.
# Repository settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Publish report and demo

on:
  push:
    branches: [main]
    paths: ["site/**", "app/static/**", "demo_data/**", "scripts/assemble_pages_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the site (paper at the root, static demo under app/)
        run: python3 scripts/assemble_pages_site.py --out _site --paper site/index.html --pdf site/paper_public.pdf --app app/static --data-root demo_data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
