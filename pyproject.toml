[project]
name = "cgt"
version = "0.1.0"
description = "Cinematic Grammar Tokenizer: films to readable shot tokens"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy", "pandas", "pyarrow", "duckdb", "pyyaml", "tqdm",
  "opencv-python", "scenedetect[opencv]", "scikit-learn", "matplotlib",
  "huggingface_hub", "pysrt",
]

[dependency-groups]
# Phase 2-5 model work; install with `uv sync --group ml`
ml = ["torch", "torchvision", "torchaudio", "open_clip_torch", "transformers", "peft",
      "ultralytics", "mediapipe", "xgboost", "shap", "datasets"]
demo = ["streamlit"]
# Phase 3B LoRA VLM track: MLX trainer for Apple silicon; torch+peft come from the ml group
vlm = ["mlx-vlm"]
dev = ["pytest", "ruff", "jupyter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cgt"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# never collect copies of tests inside local data (e.g. the release candidate tree under data/release/)
norecursedirs = ["data", "models", ".*"]
